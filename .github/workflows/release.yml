name: Build app for published release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build (for example v0.1.2)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-assets-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false
jobs:
  build-and-attach:
    runs-on: macos-15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Validate tag and existing release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected v1.2.3 or 1.2.3'; exit 1; }
          gh release view "$RELEASE_TAG" >/dev/null
          echo "APP_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          persist-credentials: false
      - name: Test
        run: swift test
      - name: Build universal app
        run: scripts/build-app.sh
      - name: Verify checksum
        run: cd dist && shasum -a 256 --check SHA256SUMS.txt
      - name: Attach app to existing release
        # No --clobber: preserve previously uploaded, possibly signed assets.
        run: gh release upload "$RELEASE_TAG" dist/Mac-Power-Schedule.zip dist/SHA256SUMS.txt
